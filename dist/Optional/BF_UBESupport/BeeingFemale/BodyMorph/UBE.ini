; Beeing Female NG - BodyMorph slider profile for UBE 2.0 (Ultimate Body Enhancer).
; UBE keeps the PregnancyBelly slider but has none of the CBBE/BHUNP breast
; sliders - this profile uses UBE 2.0's own slider names (verified against
; "UBE SE 2.0 Release Body.osp", including the literal " n|p" suffix).
; Requires Beeing Female NG 3.5.16+ (BodyMorph profiles); pick it in
; MCM > Pregnancy > Visual Scaling > Body morph profile.
; UBE meshes must be built in BodySlide with "Build Morphs" checked.
; See default.ini in this folder for the format description.

[Belly]
Morph1=PregnancyBelly
; 1.35, not 1.0: UBE's slider is weaker than CBBE 3BA's. On the bodies' own
; diff data the belly apex moves 8.2 units forward at 1.0 on UBE against 11.1
; on 3BA, so at 1.0 a UBE belly ended about a quarter flatter. 1.35 matches
; 3BA's projection. Set from that data, not from an in-game pass.
Morph1Max=1.35
Morph2=SoftBelly
Morph2Max=0.15

[Breasts]
Morph1=BreastsBigger
Morph1Max=0.4
Morph2=Juicy_breasts
Morph2Max=0.25
Morph3=BreastsCupSag n|p
Morph3Max=0.1
Morph4=AreolaeSizeBig
Morph4Max=0.25
Morph5=NipplesPerkiness
Morph5Max=0.15
